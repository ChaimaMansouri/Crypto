<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="css.css">
    <title>Crypto</title>
</head>
<body>
    <div>
        <div class="enc-buttons">
            <button class="enc" id="enc">Encryption</button>
            <button class="enc" id="dec">Decryption</button>
        </div>
        <div class="global1 G">
            <h1>Encryption</h1>
            <label for="cipherType">Select Cipher Type</label>
            <select id="cipherType">
                <option value="base64">Base64</option>
                <option value="caesar">Caesar Cipher</option>
                <option value="vigenere">Vigenère Cipher</option>
            </select>
            <label for="password">Type Password</label>
            <input type="text" id="password">
            <label for="key">Key (for Caesar or Vigenère)</label>
            <input type="text" id="key">
            <label for="encrypted">Encrypted</label>
            <div class="input" id="encrypted"></div>
            <button type="button" class="glowing-button" id="convert">Convert</button>
        </div>
        <div class="global G">
            <h1>Decryption</h1>
            <label for="cipherTypeDec">Select Cipher Type</label>
            <select id="cipherTypeDec">
                <option value="base64">Base64</option>
                <option value="caesar">Caesar Cipher</option>
                <option value="vigenere">Vigenère Cipher</option>
            </select>
            <label for="password-dec">Type Encrypted Text</label>
            <input type="text" id="password-dec">
            <label for="key-dec">Key (for Caesar or Vigenère)</label>
            <input type="text" id="key-dec">
            <label for="decrypted">Decrypted</label>
            <div class="input" id="decrypted"></div>
            <button type="button" class="glowing-button" id="convert-dec">Convert</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
